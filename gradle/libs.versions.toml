material = { module = "com.google.android.material:material", version.ref = "material" }
gif = { module = "pl.droidsonroids.gif:android-gif-drawable", version.ref = "gif" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
junit = { module = "junit:junit", version.ref = "junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
