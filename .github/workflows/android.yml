name: Android foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Build, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install isolated Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/acetimetracker-sdk"
          cli_zip="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            -o "$cli_zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $cli_zip" | sha1sum --check --strict
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$cli_zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$sdk_dir/cmdline-tools/23.0"
          export ANDROID_HOME="$sdk_dir"
          export ANDROID_SDK_ROOT="$sdk_dir"
          manager="$sdk_dir/cmdline-tools/23.0/bin/sdkmanager"
          # yes can receive SIGPIPE once sdkmanager has accepted all licenses.
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk_dir" 'platforms;android-37.0' 'build-tools;36.0.0' platform-tools
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          echo "$sdk_dir/cmdline-tools/23.0/bin" >> "$GITHUB_PATH"
          echo "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: ./gradlew --version
      - name: Host acceptance checks
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:checkDebugAarMetadata :app:assembleDebug :app:assembleDebugAndroidTest
          :app:lintDebug :app:testDebugUnitTest

  devices:
    name: API ${{ matrix.api-level }} legacy compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 27
            target: default
          - api-level: 36
            target: google_apis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install isolated Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/acetimetracker-sdk"
          cli_zip="$RUNNER_TEMP/android-commandlinetools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip \
            -o "$cli_zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $cli_zip" | sha1sum --check --strict
          mkdir -p "$sdk_dir/cmdline-tools"
          unzip -q "$cli_zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$sdk_dir/cmdline-tools/23.0"
          export ANDROID_HOME="$sdk_dir"
          export ANDROID_SDK_ROOT="$sdk_dir"
          manager="$sdk_dir/cmdline-tools/23.0/bin/sdkmanager"
          # yes can receive SIGPIPE once sdkmanager has accepted all licenses.
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk_dir" 'platforms;android-37.0' 'build-tools;36.0.0' platform-tools
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
          echo "$sdk_dir/cmdline-tools/23.0/bin" >> "$GITHUB_PATH"
          echo "$sdk_dir/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Legacy instrumentation on clean emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          avd-name: foundation-api${{ matrix.api-level }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -wipe-data
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.acetimetracker.ExampleInstrumentedTest,com.example.acetimetracker.LegacyWindowInsetsTest,com.example.acetimetracker.MainActivityBackTest,com.example.acetimetracker.LegacyWindowRuntimeTest

      - name: Retain device reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
